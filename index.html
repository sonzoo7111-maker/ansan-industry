<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지털 도슨트</title>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="app-style">
:root{
  --bg:#E9E9E0;
  --bg-elevated:#F5F4EC;
  --ink:#22261F;
  --ink-soft:#5B5E51;
  --line:#D2D0C1;
  --celadon:#3F7059;
  --celadon-soft:#DCEAE1;
  --brass:#8C6526;
  --danger:#9C4A38;
  --danger-soft:#F3E1DC;
  --qr-frame:#FFFFFF;
  --shadow:0 1px 2px rgba(30,32,25,.08), 0 8px 24px rgba(30,32,25,.07);
  --font-display:'Noto Serif KR',serif;
  --font-body:'Noto Sans KR',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14170F; --bg-elevated:#1E2217; --ink:#ECE9DC; --ink-soft:#A6A793;
    --line:#343827; --celadon:#7FB69A; --celadon-soft:#233227; --brass:#D2A25C;
    --danger:#D98670; --danger-soft:#3A231E; --qr-frame:#FFFFFF;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14170F; --bg-elevated:#1E2217; --ink:#ECE9DC; --ink-soft:#A6A793;
  --line:#343827; --celadon:#7FB69A; --celadon-soft:#233227; --brass:#D2A25C;
  --danger:#D98670; --danger-soft:#3A231E; --qr-frame:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  min-height:100vh; line-height:1.5;
}
img{max-width:100%;display:block;}
button,input,textarea{font-family:inherit;color:inherit;}
a{color:var(--celadon);}
:focus-visible{outline:2px solid var(--celadon); outline-offset:2px;}
.hairline{height:1px;background:var(--line);border:0;margin:0;}

.site-header{
  padding:2rem clamp(1rem,4vw,3rem) 1.25rem;
  display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.hall-name{font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,3vw,2.3rem);text-wrap:balance;margin:0;}
.hall-name[contenteditable="true"]{outline:1px dashed var(--celadon);padding:.1em .3em;border-radius:2px;}
.subtitle{color:var(--ink-soft);font-size:.92rem;margin:.35rem 0 0;}
.subtitle[contenteditable="true"]{outline:1px dashed var(--celadon);padding:.1em .3em;border-radius:2px;display:inline-block;}
.header-actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;}

.btn{
  font-family:var(--font-body);font-size:.85rem;font-weight:500;
  padding:.55rem 1rem;border-radius:3px;border:1px solid var(--line);
  background:var(--bg-elevated);color:var(--ink);cursor:pointer;
  transition:background .15s, border-color .15s;
}
.btn:hover{border-color:var(--celadon);}
.btn-primary{background:var(--celadon);border-color:var(--celadon);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-ghost{background:transparent;}
.btn-sm{padding:.4rem .75rem;font-size:.78rem;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.notice{
  margin:1.25rem clamp(1rem,4vw,3rem) 0;padding:.85rem 1.1rem;
  background:var(--celadon-soft);border:1px solid var(--celadon);border-radius:3px;
  font-size:.88rem;display:flex;justify-content:space-between;gap:1rem;align-items:center;color:var(--ink);
}
.notice button{background:none;border:0;color:var(--celadon);cursor:pointer;font-weight:600;font-size:.82rem;}

.gallery-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:1.1rem;padding:1.75rem clamp(1rem,4vw,3rem) 3rem;
}
.card{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:4px;
  padding:1.1rem;display:flex;flex-direction:column;gap:.65rem;box-shadow:var(--shadow);
}
.catalog-tag{
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);
}
.card-title{font-family:var(--font-display);font-weight:600;font-size:1.1rem;text-wrap:balance;margin:0;}
.card-body-row{display:flex;gap:.9rem;align-items:flex-start;}
.qr-chip{background:var(--qr-frame);padding:.4rem;border-radius:3px;display:inline-flex;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.qr-chip canvas,.qr-chip img{display:block;}
.card-links{display:flex;flex-direction:column;gap:.35rem;flex:1;justify-content:center;}
.card-links a{font-size:.85rem;text-decoration:none;font-weight:500;}
.card-langs{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);}
.card-actions{display:flex;gap:.4rem;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:.65rem;margin-top:.15rem;}
.add-card{
  border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;
  min-height:150px;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:.95rem;
}
.add-card:hover{border-color:var(--celadon);color:var(--celadon);}

.detail-wrap{max-width:640px;margin:0 auto;padding:2rem 1.25rem 4rem;}
.back-link{font-size:.85rem;text-decoration:none;color:var(--ink-soft);display:inline-block;margin-bottom:1.5rem;}
.back-link:hover{color:var(--celadon);}
.lang-tabs{display:flex;gap:.4rem;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.9rem;margin-bottom:1.6rem;}
.lang-tab{
  font-size:.85rem;padding:.4rem .95rem;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--ink-soft);cursor:pointer;
}
.lang-tab[aria-selected="true"]{background:var(--celadon-soft);color:var(--celadon);border-color:var(--celadon);font-weight:600;}
.exhibit-meta{font-family:var(--font-mono);font-size:.72rem;color:var(--brass);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem;}
.exhibit-title{font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,4.5vw,2.15rem);text-wrap:balance;margin:0 0 1rem;}
.exhibit-image{border-radius:4px;margin-bottom:1.4rem;border:1px solid var(--line);}
.exhibit-body{font-size:1.05rem;line-height:1.9;white-space:pre-wrap;max-width:64ch;}
.detail-qr-row{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--line);display:flex;align-items:center;gap:1rem;}
.detail-qr-row .qr-chip{padding:.3rem;}
.detail-qr-caption{font-size:.8rem;color:var(--ink-soft);}
.empty-state{padding:3rem clamp(1rem,4vw,3rem);color:var(--ink-soft);font-size:.95rem;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,22,15,.55);display:flex;align-items:flex-start;justify-content:center;
  padding:3vh 1rem;overflow-y:auto;z-index:50;
}
.modal{
  background:var(--bg-elevated);border-radius:5px;max-width:640px;width:100%;box-shadow:var(--shadow);
  padding:1.6rem clamp(1.1rem,3vw,2rem) 2rem;margin:auto 0;
}
.modal h2{font-family:var(--font-display);font-size:1.3rem;margin:0 0 1.1rem;}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:.35rem;}
.field input[type=text],.field textarea{
  width:100%;border:1px solid var(--line);border-radius:3px;padding:.6rem .7rem;background:var(--bg);color:var(--ink);
  font-size:.95rem;font-family:var(--font-body);
}
.field textarea{min-height:6.5rem;resize:vertical;line-height:1.65;}
.image-field-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
.image-preview{width:88px;height:88px;object-fit:cover;border-radius:3px;border:1px solid var(--line);flex-shrink:0;}
.image-preview-empty{
  width:88px;height:88px;border:1px dashed var(--line);border-radius:3px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:.72rem;color:var(--ink-soft);padding:.3rem;
}
.image-field-actions{display:flex;gap:.5rem;flex-wrap:wrap;}
.edit-lang-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;}
.edit-lang-tab{
  font-family:var(--font-mono);font-size:.75rem;padding:.35rem .7rem;border-radius:3px;border:1px solid var(--line);
  background:transparent;color:var(--ink-soft);cursor:pointer;
}
.edit-lang-tab[aria-selected="true"]{background:var(--celadon);border-color:var(--celadon);color:#fff;}
.add-lang-row{display:flex;gap:.5rem;margin-bottom:1.2rem;flex-wrap:wrap;align-items:flex-end;}
.add-lang-row .field{margin-bottom:0;flex:1;min-width:110px;}
.lang-manage-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem;}
.lang-manage-row{
  display:flex;align-items:center;gap:.75rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:3px;
  background:var(--bg);flex-wrap:wrap;
}
.lang-manage-code{font-family:var(--font-mono);font-size:.78rem;color:var(--brass);text-transform:uppercase;min-width:2.5rem;}
.lang-manage-label{font-weight:500;flex:1;min-width:80px;}
.lang-manage-count{font-size:.76rem;color:var(--ink-soft);}
.ai-row{display:flex;justify-content:flex-end;margin:-.5rem 0 .75rem;}
.ai-btn{font-size:.76rem;color:var(--celadon);background:none;border:1px solid var(--celadon);border-radius:3px;padding:.3rem .6rem;cursor:pointer;}
.ai-btn[disabled]{opacity:.55;cursor:wait;}
.modal-actions{display:flex;justify-content:space-between;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap;}
.modal-actions .right{display:flex;gap:.6rem;}
.helper-text{font-size:.78rem;color:var(--ink-soft);margin-top:-.4rem;margin-bottom:1rem;}
.qr-modal-body{display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center;}
.qr-modal-body .qr-chip{padding:1rem;}
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:.7rem 1.2rem;border-radius:4px;font-size:.85rem;box-shadow:var(--shadow);z-index:99;max-width:90vw;
}

#print-label{display:none;}
@media print{
  body>*:not(#print-label){display:none !important;}
  #print-label{
    display:flex !important;flex-direction:column;align-items:center;gap:.8rem;
    padding:2rem;color:#000;background:#fff;
  }
  #print-label .catalog-tag{color:#000;}
  #print-label .exhibit-title{color:#000;}
}
@media (max-width:520px){
  .card-body-row{flex-direction:column;}
}
</style>
</head>

<script id="state-json" type="application/json">{"meta":{"hallName":"안산산업역사박물관 기획전시","subtitle":"다국어 전시 안내 · 휴대폰으로 QR을 스캔해 감상하세요","languages":[["ko","한국어"],["en","English"],["ja","日本語"],["zh","中文"],["ru","Русский"]]},"isSample":false,"nextId":14,"exhibits":[{"id":1,"catalogNo":"01","imageUrl":"","langs":{"ko":{"label":"한국어","title":"《산업×도시=40》","body":"산업은 물건을 만드는 데서 그치지 않는다.\n새로운 기술과 제품은 우리의 일상을 바꾸고, 일터와 집, 거리와 도시의 모습까지 변화시켜 왔다.\n1986년 시로 출발한 안산의 지난 40년 역시 산업의 성장과 변화 속에서 만들어졌다.\n산업단지를 중심으로 도시가 확장되고,\n새로운 기술과 제품이 생활 속으로 들어오면서 사람들의 삶과 도시의 풍경도 함께 달라졌다.\n《산업×도시=40》은 안산시 승격 40주년을 맞아,\n산업과 도시, 그리고 그 안에서 살아온 사람들의 시간을 돌아보는 전시다.\nPART 1. 〈전자다반사〉에서는 전자산업의 발전과 함께 달라져 온 우리의 일상을,\nPART 2. 〈도시의 생애주기〉에서는 계획에서 시작해 삶이 쌓이며 변화해 온 안산의 시간을 따라간다.\n산업이 바꾼 일상, 그리고 그 일상이 만들어 온 도시의 시간.\n두 개의 이야기를 통해 지난 40년의 안산을 다시 바라본다."},"en":{"label":"English","title":"Industry × City = 40","body":"Industry is about more than making things.\nNew technologies and products have transformed our daily lives, reshaping our workplaces and homes, our streets, and even our cities.\nAnsan’s past 40 years, since it became a city in 1986, have likewise been shaped by industry’s growth and transformation.\nAs the city expanded around its industrial complexes and new technologies and products became part of everyday life, the lives of its people and the cityscape changed along with them.\nIndustry × City = 40 marks the 40th anniversary of Ansan becoming a city and looks back on the history of its industries, the city itself, and the people who have lived there.\nPART 1, Everyday Electronics, explores how everyday life has changed alongside the development of the electronics industry.\nPART 2, The Life Cycle of a City, traces Ansan from its beginnings as a planned city through the years of growth and change shaped by the lives of its people.\nEveryday life transformed by industry, and the story of a city shaped by that everyday life.\nThrough these two stories, we look back at Ansan over the past four decades."},"zh":{"label":"中文","title":"《产业×城市=40》","body":"产业并不止于制造产品。\n新技术和新产品改变了我们的日常生活，也改变了工作场所、家庭、街道乃至城市的面貌。\n安山自1986年设市以来的40年，同样由产业的成长与变迁所塑造。\n城市以产业园区为中心不断扩展，\n新技术和新产品逐渐融入日常生活，人们的生活与城市景观也随之发生了变化。\n《产业×城市=40》以安山市设市40周年为契机，\n回望产业、城市，以及生活于其中的人们共同走过的岁月。\nPART 1. 〈电子日常〉聚焦电子产业发展所带来的日常生活变迁，\nPART 2. 〈城市的生命周期〉则沿着安山从规划起步、随着生活不断积淀而变化的岁月展开。\n产业改变的日常，以及这日常所塑造的城市时间。\n通过这两个故事，重新回望安山过去40年的历程。"},"ja":{"label":"日本語","title":"《産業×都市＝40》","body":"産業は、単にモノをつくることにとどまりません。\n新しい技術や製品は私たちの日常を変え、働く場所や住まい、街や都市の姿まで変えてきました。\n1986年、市として歩み始めた安山の40年もまた、産業の成長と変化の中で形づくられてきました。\n産業団地を中心に都市が広がり、\n新しい技術や製品が暮らしの中に取り入れられ、人々の暮らしと都市の風景もまた変わっていきました。\n《産業×都市＝40》は、安山市昇格40周年を迎え、\n産業と都市、そしてその中で暮らしてきた人々の時間を振り返る展示です。\nPART 1.〈電子茶飯事〉では、電子産業の発展とともに変化してきた私たちの日常を、\nPART 2.〈都市のライフサイクル〉では、計画から始まり、人々の暮らしが折り重なる中で変化してきた安山の時間をたどります。\n産業が変えた日常、そしてその日常が紡いできた都市の時間。\n二つの物語を通して、過去40年の安山をあらためて見つめ直します。"},"ru":{"label":"Русский","title":"«Промышленность × город = 40»","body":"Промышленность — это не только производство вещей.\nНовые технологии и продукты меняют нашу повседневную жизнь, а вместе с ней — облик рабочих мест и домов, улиц и городов. \nПоследние 40 лет истории Ансана, получившего статус города в 1986 году, также связаны с развитием и преобразованием промышленности.\nГород расширялся вокруг промышленных комплексов, \nа новые технологии и продукты входили в повседневную жизнь, меняя образ жизни людей и облик города. \nВыставка «Промышленность × город = 40» приурочена к 40-летию присвоения Ансану статуса города \nи обращается к истории промышленности, самого города и его жителей. \nPART 1 «Электроника в повседневной жизни» рассказывает о том, как развитие электронной промышленности меняло нашу повседневность,\nа PART 2 «Жизненный цикл города» прослеживает путь Ансана от плана на бумаге до города, который рос и менялся вместе с жизнью своих жителей. \nПовседневная жизнь, изменённая промышленностью, и история города, которую создавала эта повседневность.\nДве истории позволяют по-новому взглянуть на прошедшие 40 лет Ансана."}}},{"id":2,"catalogNo":"02","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 1. 전자다반사","body":"우리의 일상 속에는 수많은 전자제품이 등장하고 사라졌다.\n라디오를 통해 세상의 소리를 듣고, 텔레비전 앞에 모여 같은 장면을 바라보았다.\n전화는 멀리 떨어진 사람을 이어 주었고,\n컴퓨터와 새로운 전자기기는 일하고 소통하고 즐기는 방식을 바꾸어 놓았다.\n그렇게 전자제품은 어느새 밥 먹고 차 마시듯 흔한, 우리 삶의 다반사(茶飯事)가 되었다.\n이 흔함의 뒤편에는 더 작고 빠르게 발전해 온 전자기술과, 그것을 만들어 온 산업의 오랜 여정이 있다.\n기술이 새 물건을 낳으면, 그 물건은 다시 우리의 생활과 문화를 바꾸어 놓았다.\n〈전자다반사〉는 그 흔했던 물건들을 다시 꺼내어, 전자산업과 기술이 걸어온 길을 따라\n그것들이 어떻게 달라져 왔는지를 살펴본다.\n산업의 변화는 그렇게, 아무 일도 아닌 듯 우리의 평범한 하루 속에 스며들어 있다."},"en":{"label":"English","title":"PART 1. Everyday Electronics","body":"Countless electronic devices have come and gone in our everyday lives.\nRadios brought us sounds from around the world, and televisions brought us together around the same screen.\nTelephones connected people across distances, while computers and new electronic devices transformed the ways we work, communicate, and enjoy ourselves.\nBefore long, electronic devices had become an ordinary part of life, as commonplace as eating a meal or having a cup of tea.\nBehind this familiarity lies the evolution of electronic technology, which grew smaller, faster, and more advanced, and the long journey of the industry that made it possible.\nAs technology gave rise to new products, those products in turn reshaped the way we lived and the culture around us.\nEveryday Electronics brings these once-familiar objects back into view, tracing the development of the electronics industry and its technologies to explore how they changed over time.\nIn this way, changes in industry quietly became part of our ordinary lives, almost without us noticing."},"zh":{"label":"中文","title":"PART 1. 电子日常 [英文名：Everyday Electronics]","body":"无数电子产品曾走进我们的日常生活，又悄然消失。\n我们通过收音机聆听世界的声音，也曾围坐在电视机前观看同样的画面。\n电话连接起相隔遥远的人们， \n电脑和新型电子设备则改变了人们工作、沟通和娱乐的方式。\n就这样，电子产品不知不觉间变得如家常便饭般寻常，融入了我们的日常生活。\n这份寻常的背后，是不断向更小、更快方向发展的电子技术，以及孕育这些技术的产业所走过的漫长历程。\n技术催生新的产品，而这些产品又反过来改变了我们的生活与文化。\n〈电子日常〉重新展示那些曾经司空见惯的物品，沿着电子产业与技术的发展轨迹，\n探寻它们一路走来的变化。\n产业的变迁就这样自然而然地融入我们平凡的日常。"},"ja":{"label":"日本語","title":"PART 1. 電子茶飯事　［英語名：Everyday Electronics］","body":"私たちの日常には、数多くの電子製品が登場しては消えていきました。\nラジオから世の中の音を聞き、テレビの前に集まって、同じ場面を見つめました。\n電話は遠く離れた人と人をつなぎ、\nコンピューターや新しい電子機器は、仕事やコミュニケーション、楽しみ方を変えていきました。\nそうして電子製品はいつしか、ご飯を食べてお茶を飲むように、当たり前の「茶飯事」となりました。\nこの日常の裏側には、小型化と高速化を遂げてきた電子技術と、それを生み出してきた産業の長い歩みがありました。\n技術が新たな製品を生み出し、その製品はまた私たちの暮らしや文化を変えていきました。\n〈電子茶飯事〉では、かつて身近にあったものをあらためて取り上げ、電子産業と技術が歩んできた道をたどりながら、\nそれらがどのように変化してきたのかを見ていきます。\n産業の変化は、そのようにして何事もなかったかのように、私たちのありふれた一日の中に溶け込んでいます。"},"ru":{"label":"Русский","title":"PART 1. Электроника в повседневной жизни [Английское название: Everyday Electronics]","body":"В нашей повседневной жизни появлялось и исчезало множество электронных устройств.\nРадио приносило в дом звуки большого мира, а у телевизора люди собирались вместе, чтобы смотреть на один и тот же экран.\nТелефон соединял тех, кого разделяло расстояние, \nа компьютеры и новые электронные устройства изменили то, как люди работают, общаются и проводят свободное время.\nТак электронные устройства незаметно стали такой же привычной частью нашей жизни, как еда или чашка чая.\nЗа этой привычностью стоит долгий путь электронных технологий, которые становились всё компактнее и быстрее, и промышленности, которая их создавала. \nТехнологии создавали новые вещи, а те, в свою очередь, меняли наш образ жизни и культуру.\nРаздел «Электроника в повседневной жизни» вновь обращается к этим когда-то привычным вещам и показывает, как они менялись по мере развития электронной промышленности и технологий.\nТак перемены в промышленности незаметно проникли в самые обычные дни нашей жизни."}}},{"id":3,"catalogNo":"03","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 1-1. 전자설명서","body":"전자제품의 기본을 읽다\n전자제품은 우리 일상에서 쉽게 접할 수 있지만,\n그 안에서 어떤 원리로 작동하는지는 잘 드러나지 않는다.\n전자기술은 진공관에서 시작해 트랜지스터와 집적회로(IC)를 거치며\n점차 작아지고 정교해졌고,\nPCB를 통해 이 모든 부품이 하나의 구조로 연결되었다.\n이 작은 변화들이 전자제품의 형태와 성능을 바꾸며,\n오늘날 우리가 사용하는 다양한 기기의 기반이 되었다.\n보이지 않는 곳에서 작동해 온 이 원리들을,\n〈전자설명서〉에서 하나씩 들여다본다."},"en":{"label":"English","title":"PART 1-1. Electronics Manual","body":"Understanding the Basics of Electronics\nElectronic devices are all around us in our everyday lives,\nbut the principles that make them work often remain out of sight.\nElectronic technology evolved from vacuum tubes to transistors and integrated circuits (ICs),\nbecoming smaller and more sophisticated over time.\nPrinted circuit boards (PCBs) brought these components together into a single system.\nThese incremental advances transformed the form and performance of electronic products\nand laid the foundation for the many devices we use today.\nElectronics Manual takes a closer look, one by one,\nat the principles that have long been at work behind the scenes."},"zh":{"label":"中文","title":"PART 1-1. 电子说明书 [英文名：Electronics Manual]","body":"读懂电子产品的基础\n电子产品在日常生活中随处可见，\n但其内部究竟遵循怎样的原理运行，却往往并不为人所知。\n电子技术从真空管起步，历经晶体管和集成电路（IC），\n逐渐变得更小、更精密，\n所有部件则通过印刷电路板（PCB）连接成一个结构。\n这些变化不断改变着电子产品的形态与性能，\n并成为如今各种设备的基础。\n〈电子说明书〉将逐一审视那些一直在看不见的地方运作的原理。"},"ja":{"label":"日本語","title":"PART 1-1. 電子説明書　［英語名：Electronics Manual］","body":"電子製品の基本を読み解く\n電子製品は私たちの日常で身近な存在ですが、\nその内側でどのような原理によって動いているのかは、なかなか目に見えません。\n電子技術は真空管から始まり、トランジスタ、集積回路（IC）へと進む中で、\n次第に小型化・高度化していき、\nプリント基板(PCB)によって、これらすべての部品が一つの構造としてつながりました。\nこうした小さな変化の積み重ねが電子製品の形や性能を変え、\n今日私たちが使うさまざまな機器の基盤となりました。\n目に見えないところで働いてきた原理を、\n〈電子説明書〉で一つずつのぞいてみます。"},"ru":{"label":"Русский","title":"PART 1-1. Путеводитель по электронике [Английское название: Electronics Manual]","body":"Разбираемся в основах электроники\nЭлектронные устройства окружают нас в повседневной жизни,\nоднако принципы их работы обычно остаются скрытыми от глаз.\nЭлектронные технологии прошли путь от радиоламп к транзисторам и интегральным схемам (IC), \nстановясь всё компактнее и совершеннее,\nа печатные платы (PCB) позволили объединить все эти компоненты в единую систему.\nЭти небольшие изменения преобразили форму и характеристики электронных устройств\nи заложили основу для множества приборов, которыми мы пользуемся сегодня.\nВ разделе «Путеводитель по электронике» мы шаг за шагом знакомимся\nс принципами, которые всё это время работали незаметно для нас."}}},{"id":4,"catalogNo":"04","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 1-2. 전자로 넓어진 일상","body":"전자기술의 발전은 세상의 소리와 모습을 일상 가까이 가져왔다.\n라디오를 통해 멀리서 전해지는 소식과 음악을 듣고,\n텔레비전을 통해 소리와 함께 움직이는 화면을 만나게 되었다.\n새로운 전자기기의 등장은 사람들이 정보를 접하고 문화를 즐기는 방식을 바꾸어 놓았다.\n소리에서 화면으로, 전자기술은 우리가 세상을 보고 듣는 경험을 넓히며\n일상의 풍경을 변화시켜 왔다."},"en":{"label":"English","title":"PART 1-2. Everyday Life Expanded by Electronics","body":"Advances in electronic technology brought the sounds and images of the wider world closer to everyday life.\nRadios brought news and music from far away into the home,\nwhile television brought moving images and sound into our lives.\nThe arrival of new electronic devices changed the way people accessed information and enjoyed culture.\nFrom sound to moving images, electronic technology broadened how we experience the world\nand transformed the landscape of everyday life."},"zh":{"label":"中文","title":"PART 1-2. 电子技术拓展日常","body":"电子技术的发展，让世界的声音与画面走近了日常生活。\n人们通过收音机听到从远方传来的消息与音乐，\n又通过电视看到了伴随着声音而动的画面。 \n新型电子设备的出现，改变了人们获取信息和体验文化的方式。\n从声音到画面，电子技术不断拓展我们感受世界的方式，\n也持续改变着日常生活的面貌。"},"ja":{"label":"日本語","title":"PART 1-2. 電子が広げた日常","body":"電子技術の発展によって、世の中の音や映像が私たちの日常の身近なものになりました。\nラジオを通して遠くから届くニュースや音楽を聞き、\nテレビを通して音とともに動く映像を見るようになりました。\n新しい電子機器の登場は、人々が情報に触れ、文化を楽しむ方法を変えていきました。\n音から映像へ。電子技術は、私たちが世の中を見て、聞くという体験を広げながら、\n日常の風景を変えてきました。"},"ru":{"label":"Русский","title":"PART 1-2. Электроника расширяет границы повседневности","body":"Развитие электронных технологий приблизило к повседневной жизни звуки и образы большого мира.\nРадио доносило издалека новости и музыку, а телевидение принесло в дом движущееся изображение вместе со звуком. \nПоявление новых электронных устройств изменило способы получения информации и приобщения к культуре.\nОт звука к изображению электронные технологии расширяли наши возможности видеть и слышать мир\nи постепенно меняли облик повседневной жизни."}}},{"id":5,"catalogNo":"05","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 1-3. 전자로 이어진 일상","body":"눈에 보이지 않는 신호는 멀리 떨어진 사람과 세상을 이어 왔다.\n우리나라의 근대 통신은 1885년 서울과 인천을 잇는 전신선이 설치되면서 시작되었다.\n짧은 메시지를 전달하던 전보에서 출발한 통신은 전화와 인터넷을 거치며 발전했고,\n오늘날에는 언제 어디서나 연결되는 환경으로 이어졌다.\n전자기술의 발전은 시간과 공간의 제약을 넘어,\n사람과 사람을 잇는 방식을 계속해서 바꾸어 왔다."},"en":{"label":"English","title":"PART 1-3. Connected by Electronics","body":"Invisible signals have long connected people across distances and linked them to the wider world.\nModern telecommunications in Korea began in 1885 with the installation of a telegraph line connecting Seoul and Incheon.\nWhat began with telegrams carrying short messages evolved with the telephone and the internet,\neventually creating a world in which people can stay connected anytime and anywhere.\nAdvances in electronic technology have continued to transform how people connect with one another,\novercoming the constraints of time and distance."},"zh":{"label":"中文","title":"PART 1-3. 电子连接的日常","body":"看不见的信号，一直连接着相隔遥远的人们，也连接着人与世界。\n韩国的近代通信始于1885年首尔与仁川之间电报线路的架设。\n通信从传递简短信息的电报起步，历经电话和互联网的发展，\n如今已进入随时随地都能保持连接的时代。\n电子技术的发展突破了时间与空间的限制，\n不断改变着人与人之间建立联系的方式。"},"ja":{"label":"日本語","title":"PART 1-3. 電子でつながった日常","body":"目に見えない信号が、遠く離れた人と人、そして世界をつないできました。\n韓国の近代通信は、1885年、ソウルと仁川を結ぶ電信線が敷設されたことから始まりました。\n短いメッセージを伝える電報から始まった通信は、電話、インターネットへと発展し、\n今日、私たちはいつでもどこでもつながる環境の中で暮らしています。\n電子技術の発展は、時間と空間の制約を越え、\n人と人をつなぐ方法を絶えず変えてきました。"},"ru":{"label":"Русский","title":"PART 1-3. Повседневность на связи","body":"Невидимые сигналы соединяли людей, разделённых расстоянием, и связывали их с большим миром.\nЭпоха современной связи в Корее началась в 1885 году с прокладки телеграфной линии между Сеулом и Инчхоном.\nНачавшись с телеграмм для передачи коротких сообщений, средства связи совершенствовались с появлением телефона и интернета, \nа сегодня позволяют оставаться на связи в любое время и в любом месте.\nРазвитие электронных технологий помогло преодолеть ограничения времени и пространства \nи продолжает менять способы, которыми люди поддерживают связь друг с другом."}}},{"id":6,"catalogNo":"06","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 1-4. MADE IN ANSAN","body":"안산의 산업현장에서는\n우리의 일상을 채운 다양한 생활제품이 만들어졌다.\n타자기와 컴퓨터, 텔레비전과 라디오카세트부터\n밥솥과 믹서기, 선풍기와 전기난로까지,\n안산에서 생산된 제품들은 집과 일터 곳곳에서 사용되며\n사람들의 생활과 함께해 왔다.\n우리 주위의 익숙한 물건들 속에는,\n그렇게 안산의 이름이 새겨져 있었다."},"en":{"label":"English","title":"PART 1-4. MADE IN ANSAN","body":"Ansan’s industrial sites produced a wide range of everyday products\nthat became part of daily life.\nFrom typewriters and computers to televisions and radio-cassette players,\nand from rice cookers and blenders to fans and electric heaters,\nproducts made in Ansan found their way into homes and workplaces\nand became part of people’s everyday lives.\nIn this way, the name Ansan was woven into\nthe familiar objects that surrounded us."},"zh":{"label":"中文","title":"PART 1-4. MADE IN ANSAN","body":"在安山的产业生产现场，\n曾生产出各种融入我们日常生活的产品。\n从打字机、电脑、电视机和收录机，\n到电饭煲、搅拌机、电风扇和电暖器，\n安山生产的产品广泛用于家庭和工作场所，\n陪伴着人们的日常生活。\n就这样，我们身边那些熟悉的物品中，\n也铭刻着安山的名字。"},"ja":{"label":"日本語","title":"PART 1-4. MADE IN ANSAN","body":"安山では、\n私たちの暮らしを彩るさまざまな製品がつくられてきました。\nタイプライターやコンピューター、テレビやラジオカセットから、\n炊飯器やミキサー、扇風機や電気ストーブまで、\n安山で生産された製品は、家庭や職場のさまざまな場所で使われ、\n人々の暮らしとともに歩んできました。\n私たちの身の回りにある物の中には、\nそのように安山の名が刻まれていました。"},"ru":{"label":"Русский","title":"PART 1-4. MADE IN ANSAN","body":"На промышленных предприятиях Ансана\nпроизводились самые разные товары, ставшие частью нашей повседневной жизни.\nОт пишущих машинок и компьютеров, телевизоров и магнитол\nдо рисоварок, блендеров, вентиляторов и электрических обогревателей —\nпродукция, изготовленная в Ансане, использовалась в домах и на рабочих местах\nи сопровождала людей в их повседневной жизни.\nТак на привычных вещах вокруг нас\nбыло запечатлено имя Ансана. "}}},{"id":7,"catalogNo":"07","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 2. 도시의 생애주기","body":"도시는 한순간에 만들어지지 않는다.\n종이 위에 그려진 계획에서 시작해 길이 놓이고 건물이 들어서며, 사람들이 모여 살아가기 시작한다.\n시간이 흐르면 도시의 영역은 넓어지고, 오래된 공간은 사라지거나 새로운 모습으로 다시 태어난다.\n안산도 그렇게 태어나고 자라 왔다.\n산업과 함께 성장한 이 도시에는, 지난 40년 동안 수많은 공간이 생겨나고 사라지며, 그곳을 살아온 사람들의 일상과 기억이 차곡차곡 쌓였다.\n〈도시의 생애주기〉는 도시가 없던 시절의 풍경에서부터 계획과 건설, 확장과 변화에 이르기까지, 안산이 만들어져 온 시간을 따라간다.\n도면과 사진, 기록자료와 시민들의 기억이, 그 시간을 하나씩 되짚어 준다.\n도시는 완성되는 것이 아니라, 시간과 삶이 쌓이며 끊임없이 다시 만들어진다."},"en":{"label":"English","title":"PART 2. The Life Cycle of a City","body":"A city is not built overnight.\nIt begins as a plan drawn on paper. Roads are laid, buildings rise, and people begin to settle and build their lives there.\nOver time, the city expands, while older spaces disappear or take on new forms.\nAnsan was born and grew in much the same way.\nOver the past 40 years, as the city grew alongside industry, countless places appeared and disappeared, leaving behind layers of everyday life and memories shaped by the people who lived there.\nThe Life Cycle of a City traces the making of Ansan, from the landscape before the city existed through planning and construction to expansion and change.\nPlans, photographs, archival records, and the memories of residents help retrace that history, one piece at a time.\nA city is never truly finished. It is continually remade as time passes and lives unfold within it."},"zh":{"label":"中文","title":"PART 2. 城市的生命周期 [英文名：The Life Cycle of a City]","body":"城市并非一朝一夕建成。\n它始于纸上绘制的规划，道路铺设、建筑落成，人们开始聚居于此。\n随着时间流逝，城市的范围不断扩大，旧有空间逐渐消失，或以新的面貌获得新生。\n安山也正是这样诞生、成长起来的。\n这座与产业共同成长的城市，在过去40年间，无数空间不断出现又消失，而生活于此的人们的日常与记忆，也一点点积累起来。\n〈城市的生命周期〉从城市尚未出现时的风景出发，沿着规划、建设、扩张与变迁的轨迹，追溯安山形成的历程。\n图纸、照片、档案资料以及市民的记忆，带我们逐一回望那段岁月。\n城市并非建成之后便告完成，而是随着时间与生活的积淀，不断被重新塑造。"},"ja":{"label":"日本語","title":"PART 2. 都市のライフサイクル　［英語名：The Life Cycle of a City］","body":"都市は、一瞬にしてつくられるものではありません。\n紙の上に描かれた計画から始まり、道がつくられ、建物が建ち、人々が集まって暮らし始めます。\n時の流れとともに都市は広がり、姿を消す古い空間もあれば、新たな姿へと生まれ変わる空間もあります。\n安山もまた、そうして生まれ、成長してきました。\n産業とともに発展してきたこの都市には、過去40年の間に数多くの空間が生まれては消え、そこで暮らしてきた人々の日常と記憶が積み重なってきました。\n〈都市のライフサイクル〉では、都市がまだ存在しなかった時代の風景から、計画と建設、拡張と変化に至るまで、安山がつくられてきた時間をたどります。\n図面や写真、記録資料、市民の記憶が、安山の時間を一つひとつ手繰り寄せます。\n都市は完成するものではなく、時を重ね、人々の暮らしが積まれていく中で、絶えず新たにつくられていきます。"},"ru":{"label":"Русский","title":"PART 2. Жизненный цикл города [Английское название: The Life Cycle of a City]","body":"Город не возникает в одно мгновение.\nВсё начинается с плана на бумаге: появляются дороги и здания, люди приезжают и начинают здесь жить.\nСо временем город расширяется, а старые пространства исчезают или обретают новую жизнь.\nТаким же образом родился и вырос Ансан.\nЗа последние 40 лет в этом городе, развивавшемся вместе с промышленностью, появлялось и исчезало множество мест, а повседневная жизнь и воспоминания его жителей постепенно наслаивались друг на друга.\nРаздел «Жизненный цикл города» прослеживает путь формирования Ансана — от пейзажей тех времён, когда города ещё не было, через планирование и строительство к расширению и переменам.\nЧертежи, фотографии, архивные материалы и воспоминания горожан помогают шаг за шагом восстановить это время.\nГород никогда не бывает окончательно завершённым:\nон постоянно создаётся заново по мере того, как в нём накапливаются время и жизнь людей."}}},{"id":8,"catalogNo":"08","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 2-1. 종이 위에서 시작하다","body":"도시가 만들어지기 전,\n안산의 모습은 지금과는 크게 달랐다.\n1970년대, 반월신공업도시 건설계획이 추진되면서\n도로와 산업단지, 주거지역과 생활공간이 종이 위에 그려지기 시작했다.\n도면 위의 선과 계획으로 시작된 도시는\n점차 실제 공간으로 모습을 드러내며\n오늘날 안산의 바탕이 되었다."},"en":{"label":"English","title":"PART 2-1. Beginning on Paper","body":"Before the city was built,\nAnsan looked very different from the city we know today.\nIn the 1970s, as plans for the Banwol New Industrial City were set in motion,\nroads, industrial complexes, residential areas, and spaces for daily life began to take shape on paper.\nWhat began as lines and plans on paper\ngradually took shape in the real world,\nlaying the foundation for Ansan today."},"zh":{"label":"中文","title":"PART 2-1. 从纸上起步","body":"在城市建成之前，\n安山的面貌与今天大不相同。\n20世纪70年代，随着半月新工业城市建设计划的推进，\n道路、产业园区、住宅区与生活空间开始被绘制在纸上。\n这座从图纸上的线条与规划起步的城市，\n逐渐在现实空间中显现出轮廓，\n并奠定了今日安山的基础。"},"ja":{"label":"日本語","title":"PART 2-1. 紙の上で始まる","body":"都市がつくられる前、\n安山の姿は今とは大きく異なっていました。\n1970年代、半月新工業都市建設計画が進められ、\n道路や産業団地、住宅地域や生活空間が紙の上に描かれ始めました。\n図面上の線と計画から始まった都市は、\n次第に実際の空間として姿を現し、\n今日の安山の基盤となりました。"},"ru":{"label":"Русский","title":"PART 2-1. Всё начинается на бумаге","body":"Прежде чем стать городом, \nАнсан выглядел совсем иначе, чем сегодня.\nВ 1970-е годы, с началом реализации плана строительства нового промышленного города Панволь,\nна бумаге стали появляться дороги, промышленные комплексы, жилые районы и пространства для повседневной жизни.\nГород, начавшийся с линий и планов на чертежах,\nпостепенно обретал реальные очертания\nи стал основой современного Ансана."}}},{"id":9,"catalogNo":"09","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 2-2. 도시를 짓다","body":"도면 위의 선들이 실제 땅 위에 놓이기 시작했다.\n땅을 다지고 도로를 내며 산업단지와 주거지가 들어섰고,\n사람들이 살아가기 위한 크고 작은 기반들도 하나씩 갖추어졌다.\n계획으로 시작된 도시는, 건설의 시간을 거쳐\n점차 삶의 공간으로 채워져 갔다."},"en":{"label":"English","title":"PART 2-2. Building the City","body":"The lines on the plans began to take shape on the ground.\nLand was prepared and roads were built, followed by industrial complexes and residential areas.\nLarge- and small-scale infrastructure needed for everyday life was put in place, one element at a time.\nWhat began as a plan gradually became a place to live,\ntaking shape through the long process of construction."},"zh":{"label":"中文","title":"PART 2-2. 建设城市","body":"图纸上的线条开始在真正的土地上化为现实。\n土地得到平整，道路逐步铺设，产业园区和住宅区相继建成，\n人们生活所需的大大小小的基础设施也逐一完善起来。\n从规划起步的城市，经过建设阶段，\n逐渐成为承载人们生活的空间。"},"ja":{"label":"日本語","title":"PART 2-2.　都市をつくる","body":"図面の上に描かれた線が、実際の土地の上に置かれ始めました。\n土地を開発し、道路をつくり、産業団地と住宅地が姿を現し、 \n人が暮らすための大小の基盤も一つひとつ整備されていきました。\n計画から始まった都市は、建設の時を経て、\n次第に人々の暮らしの場へと姿を変えていきました。"},"ru":{"label":"Русский","title":"PART 2-2. Строительство города","body":"Линии на чертежах начали воплощаться на реальной земле.\nЗемлю выравнивали, прокладывали дороги, строили промышленные комплексы и жилые районы,\nа необходимая для жизни инфраструктура, большая и малая, появлялась шаг за шагом. \nГород, начавшийся как проект, прошёл через этап строительства\nи постепенно наполнялся жизнью. "}}},{"id":10,"catalogNo":"10","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 2-3. 도시의 시간","body":"1986년, 이름을 얻은 도시는 거기서 멈추지 않았다.\n도로와 교통망이 확장되고 새로운 생활공간이 들어서며,\n안산의 영역과 풍경은 계속해서 달라졌다.\n그 변화의 시간이 쌓여, 지금 우리가 살아가는 안산이 되었다."},"en":{"label":"English","title":"PART 2-3. A City Through Time","body":"In 1986, Ansan officially became a city, but its story did not stop there.\nAs roads and transportation networks expanded and new residential and community spaces emerged,\nAnsan continued to grow and change in both scale and appearance.\nThose years of change have shaped the Ansan we know and live in today."},"zh":{"label":"中文","title":"PART 2-3. 城市的岁月","body":"1986年，获得城市之名的安山并未就此止步。\n随着道路与交通网络不断扩展，新的生活空间陆续出现，\n安山的城市范围与面貌也持续发生变化。\n这些变化的岁月不断积累，形成了今天我们生活的安山。"},"ja":{"label":"日本語","title":"PART 2-3. 都市の時間","body":"1986年、安山という名を得た都市は、そこで歩みを止めることはありませんでした。\n道路や交通網が伸び、新たな生活空間が生まれる中で、\n安山はさらに広がり、風景は絶えず変化してきました。\nその変化の時間が積み重なり、今、私たちが暮らす安山となりました。"},"ru":{"label":"Русский","title":"PART 2-3. Время города","body":"В 1986 году Ансан получил статус города, но его развитие на этом не остановилось.\nРасширялись дороги и транспортная сеть, появлялись новые пространства для жизни,\nа территория и облик Ансана продолжали меняться.\nГоды этих перемен и создали тот Ансан, в котором мы живём сегодня."}}},{"id":11,"catalogNo":"11","imageUrl":"","langs":{"ko":{"label":"한국어","title":"PART 2-4. 나의 도시, 나의 안산","body":"도시는 건물과 길만으로 만들어지지 않는다.\n그곳에 살아가는 사람들의 삶과 기억이 더해지며 비로소 하나의 도시가 된다.\n삶의 터전이 되어 온 집과 동네,\n가족과 친구와 함께한 평범한 일상의 순간들은\n저마다의 기억으로 남아 안산의 시간을 채워 왔다.\n도시의 역사는 곧 그곳을 살아온 사람들의 역사이다.\n그 기억이 모여 지금의 안산이 되었다."},"en":{"label":"English","title":"PART 2-4. My City, My Ansan","body":"A city is made of more than buildings and roads.\nIt becomes a real city through the lives and memories of the people who call it home.\nHomes and neighborhoods that became part of people’s lives,\nand ordinary moments shared with family and friends,\nhave remained as personal memories, becoming part of Ansan’s history.\nThe history of a city is also the history of the people who have lived there.\nTogether, those memories have shaped the Ansan of today."},"zh":{"label":"中文","title":"PART 2-4. 我的城市，我的安山","body":"城市并非仅由建筑与道路构成。\n生活于此的人们的日常与记忆不断汇聚，城市也由此真正形成。\n作为生活之所的家与社区，\n与家人和朋友共同度过的平凡日常，\n都成为各自的记忆，一点点填满了安山走过的岁月。\n城市的历史，也正是生活于此的人们的历史。\n这些记忆汇聚在一起，形成了今天的安山。"},"ja":{"label":"日本語","title":"PART 2-4. 私の都市、私の安山","body":"都市は、建物と道だけで成り立つものではありません。\nそこに暮らす人々の生活と記憶が加わってはじめて一つの都市となります。\n暮らしの場となってきた家や地域、\n家族や友人と過ごした何気ない日常は、\nそれぞれの記憶となり、安山の「時」として刻まれてきました。\n都市の歴史は、すなわち、そこで暮らしてきた人々の歴史です。\nその記憶が集まり、今の安山となりました。"},"ru":{"label":"Русский","title":"PART 2-4. Мой город, мой Ансан","body":"Город состоит не только из зданий и дорог.\nНастоящим городом он становится благодаря жизни и воспоминаниям людей, которые в нём живут.\nДома и районы, ставшие местом повседневной жизни,\nобычные моменты, проведённые с семьёй и друзьями,\nсохранились в личных воспоминаниях и наполнили собой историю Ансана.\nИстория города — это и есть история людей, которые в нём жили.\nИменно из этих воспоминаний сложился сегодняшний Ансан."}}},{"id":12,"catalogNo":"12","imageUrl":"","langs":{"ko":{"label":"한국어","title":"안산이 건네는 인사","body":"사진 속에 멈춰 있던 안산의 시간이 다시 움직인다.\n거리에서, 동네에서, 가족과 친구들과 함께했던 평범한 순간들.\n그 시절 안산의 풍경과 그 안을 살아가던 사람들이\n오늘의 우리를 향해 손을 흔든다.\n그때의 안산과 지금의 우리가, 사진 한 장을 사이에 두고 잠시 마주한다.\n시간을 건너, 40년 전 안산이 지금의 우리에게 인사를 건넨다."},"en":{"label":"English","title":"Hello, ANSAN","body":"A moment in Ansan once frozen in a photograph begins to move again.\nOrdinary moments shared on the streets, in neighborhoods, and with family and friends.\nThe landscapes of Ansan from those days, and the people who once lived among them,\nseem to wave to us across time.\nFor a brief moment, Ansan as it was then and we who live here today meet through a single photograph.\nAcross four decades, the Ansan of the past reaches out to greet us today."},"zh":{"label":"中文","title":"安山向你问好 [英文名：Hello, ANSAN]","body":"定格在照片中的安山时光，再次流动起来。\n在街道上，在社区里，与家人和朋友共同度过的平凡瞬间。\n那个年代安山的风景，以及生活在其中的人们，\n正向今天的我们挥手。\n昔日的安山与今天的我们，隔着一张照片，短暂相望。\n跨越时光，40年前的安山向今天的我们送来问候。"},"ja":{"label":"日本語","title":"ハロー、安山　［英語名：Hello, ANSAN］","body":"写真の中で止まっていた安山の時間が、再び動き始めます。\n街で、地域で、家族や友人とともに過ごした何気ない瞬間。\nあの頃の安山の風景と、そこで暮らしていた人々が、\n今日の私たちに向かって手を振っています。\nあの頃の安山と今の私たちが、一枚の写真を前に、しばし向き合います。\n40年前の安山が、時を超えて今の私たちに呼びかけてきます。"},"ru":{"label":"Русский","title":"Привет от Ансана [Английское название: Hello, ANSAN]","body":"Время Ансана, застывшее на фотографиях, вновь приходит в движение.\nОбычные моменты на улицах и в районах города, рядом с семьёй и друзьями.\nПейзажи Ансана тех лет и люди, жившие среди них,\nсловно машут рукой нам, сегодняшним.\nНа мгновение Ансан прошлого и мы, сегодняшние, встречаемся по разные стороны одной фотографии.\nПреодолев 40 лет, Ансан прошлого передаёт привет нам, сегодняшним."}}},{"id":13,"catalogNo":"13","imageUrl":"","langs":{"ko":{"label":"한국어","title":"즐거운 나의 집, 안산","body":"1986년, 새로운 도시 안산에 사람들이 모여들고\n수많은 집에 저마다의 삶이 자리 잡기 시작했다.\n텔레비전과 라디오, 전화기와 같은 전자제품은\n집 안의 풍경을 바꾸고 일상에 새로운 편리함과 즐거움을 더했다.\n새로 지어진 집에는 낯선 물건들이 하나둘 채워지고,\n그 안에서 사람들의 하루와 도시의 시간이 함께 흘러갔다.\n그로부터 40년.\n일상을 함께했던 전자제품은 새로운 기술과 모습으로 바뀌었고,\n한때 새로운 삶의 터전이었던 집과 도시 역시 변화의 시간을 지나고 있다.\n물건이 바뀌고, 집이 변하고, 도시가 다시 만들어지는 동안에도\n그 안에는 언제나 사람들의 삶이 있었다.\n1986년에서 2026년까지,\n우리가 살아온 집의 풍경 속에 안산의 40년이 쌓여 있다."},"en":{"label":"English","title":"Home, Sweet Home, Ansan","body":"In 1986, people began to settle in the new city of Ansan,\nand countless homes became the setting for new lives.\nElectronic devices such as televisions, radios, and telephones\nchanged the look of the home and brought new convenience and enjoyment to everyday life.\nNewly built homes gradually filled with unfamiliar objects,\nand within them, the rhythms of daily life unfolded alongside the changing city.\nForty years have passed.\nThe electronic devices that once shared our everyday lives have evolved in technology and form,\nwhile the homes and the city that once provided a place to build new lives have also continued to change.\nEven as products changed, homes evolved, and the city was reshaped,\npeople’s lives remained at the heart of it all.\nFrom 1986 to 2026,\n40 years of Ansan are reflected in the homes where people have lived their lives."},"zh":{"label":"中文","title":"甜蜜之家，安山 [英文名：Home, Sweet Home, Ansan]","body":"1986年，人们纷纷涌入新兴城市安山，\n无数个家中，各自的生活开始扎根。\n电视机、收音机、电话等电子产品，\n改变了家庭生活的面貌，也为日常增添了新的便利与乐趣。 \n新建的住宅里，一件件陌生的物品逐渐填满空间，\n人们的日常与城市的岁月也在其中一同流淌。\n此后40年。\n陪伴日常生活的电子产品，已焕然一新，拥有了新的技术与形态，\n曾经崭新的生活家园与城市，也同样正经历着变迁。\n即使物品不断更新、住宅不断变化、城市一次次被重新塑造，\n其中始终承载着人们的生活。\n从1986年到2026年，\n在我们生活过的家的景象中，积淀着安山40年的时光。"},"ja":{"label":"日本語","title":"楽しい我が家、安山　［英語名：Home, Sweet Home, Ansan］","body":"1986年、新しい都市・安山に人々が集まり、\n数多くの家で、それぞれの暮らしが根づき始めました。\nテレビやラジオ、電話機などの電子製品は、\n家の中の風景を変え、日常に新たな便利さと楽しさをもたらしました。\n新しく建てられた家には、 見慣れぬ物が一つ、また一つと運び込まれ、\nその中で人々の一日と都市の時間が流れていきました。\nそれから40年。\n日々の暮らしをともにしてきた電子製品は、新たな技術とともに姿を変え、\nかつて新しい暮らしの場であった家や都市もまた、変化の時を歩んでいます。\n物が変わり、家が変わり、都市が再びつくられていく間にも、\nそこにはいつも人々の暮らしがありました。\n1986年から2026年まで、\n私たちが暮らしてきた家の風景の中に、安山の40年が重なっています。"},"ru":{"label":"Русский","title":"Дом, милый дом — Ансан [Английское название: Home, Sweet Home, Ansan]","body":"В 1986 году люди начали приезжать в новый город Ансан, \nи в каждом из множества домов начинала складываться своя жизнь. \nТелевизоры, радиоприёмники, телефоны и другие электронные устройства \nизменили домашний быт, сделав повседневную жизнь удобнее и приятнее.\nНовые дома постепенно наполнялись непривычными вещами, \nа в их стенах будни людей и время города протекали вместе. \nС тех пор прошло 40 лет. \nЭлектронные устройства, когда-то сопровождавшие повседневную жизнь, изменились вместе с новыми технологиями и приобрели новый облик, \nа дома и город, некогда ставшие новым местом для жизни, также проходят через время перемен. \nНо даже когда менялись вещи, перестраивались дома и заново формировался город, \nв центре всего этого всегда оставалась жизнь людей.\nС 1986 по 2026 год —\n40 лет истории Ансана сохранились в облике домов, в которых проходила наша жизнь."}}}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script id="app-logic">
(function(){
  "use strict";
  var STATE = JSON.parse(document.getElementById('state-json').textContent);

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function qrUrl(id){
    return location.origin + location.pathname + '#/exhibit/' + id;
  }
  function findExhibit(id){
    id = Number(id);
    for (var i=0;i<STATE.exhibits.length;i++) if (STATE.exhibits[i].id === id) return STATE.exhibits[i];
    return null;
  }
  function langList(ex){
    return Object.keys(ex.langs);
  }
  function primaryLang(ex){
    var keys = langList(ex);
    if (keys.indexOf('ko') !== -1) return 'ko';
    return keys[0];
  }

  function renderQrInto(container, url, size){
    container.innerHTML = '';
    new QRCode(container, {
      text: url, width: size, height: size,
      colorDark: '#1A1A1A', colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  function route(){
    var hash = location.hash || '';
    var m = hash.match(/^#\/exhibit\/(.+)$/);
    if (m) renderDetail(m[1]);
    else renderGallery();
  }

  function headerHtml(){
    return (
      '<header class="site-header">' +
        '<div>' +
          '<h1 class="hall-name">' + esc(STATE.meta.hallName) + '</h1>' +
          '<p class="subtitle">' + esc(STATE.meta.subtitle) + '</p>' +
        '</div>' +
      '</header>'
    );
  }

  var detailLangChoice = {};

  function renderGallery(){
    var app = document.getElementById('app');
    var html = headerHtml();

    if (STATE.exhibits.length === 0){
      html += '<div class="empty-state">등록된 전시품이 없습니다.</div>';
    } else {
      html += '<div class="gallery-grid" id="gallery-grid">';
      STATE.exhibits.forEach(function(ex){
        var lang = ex.langs[primaryLang(ex)] || {title:'(제목 없음)'};
        var langs = langList(ex).map(function(k){ return ex.langs[k].label; }).join(' · ');
        html += (
          '<article class="card">' +
            '<span class="catalog-tag">' + esc(ex.catalogNo || '') + '</span>' +
            '<div class="card-body-row">' +
              '<span class="qr-chip" data-qr-id="' + ex.id + '"></span>' +
              '<div class="card-links">' +
                '<h2 class="card-title">' + esc(lang.title) + '</h2>' +
                '<a href="#/exhibit/' + ex.id + '">전시 안내 보기 →</a>' +
                '<span class="card-langs">' + esc(langs) + '</span>' +
              '</div>' +
            '</div>' +
          '</article>'
        );
      });
      html += '</div>';
    }

    app.innerHTML = html;

    STATE.exhibits.forEach(function(ex){
      var chip = app.querySelector('[data-qr-id="' + ex.id + '"]');
      if (chip) renderQrInto(chip, qrUrl(ex.id), 84);
    });
  }

  function renderDetail(idStr){
    var app = document.getElementById('app');
    var ex = findExhibit(idStr);
    if (!ex){
      app.innerHTML = headerHtml() + '<div class="empty-state">전시품을 찾을 수 없습니다. <a href="#/">전체 목록으로 돌아가기</a></div>';
      return;
    }
    var keys = langList(ex);
    var current = detailLangChoice[ex.id] && ex.langs[detailLangChoice[ex.id]] ? detailLangChoice[ex.id] : primaryLang(ex);
    var lang = ex.langs[current];

    var html = headerHtml();
    html += '<div class="detail-wrap">';
    html += '<a class="back-link" href="#/">← 전체 목록으로</a>';
    html += '<div class="lang-tabs" role="tablist">';
    keys.forEach(function(k){
      html += '<button class="lang-tab" role="tab" aria-selected="' + (k === current ? 'true' : 'false') + '" data-lang="' + esc(k) + '">' + esc(ex.langs[k].label) + '</button>';
    });
    html += '</div>';
    if (ex.catalogNo) html += '<div class="exhibit-meta">' + esc(ex.catalogNo) + '</div>';
    html += '<h1 class="exhibit-title">' + esc(lang.title || '(제목 없음)') + '</h1>';
    if (ex.imageUrl) html += '<img class="exhibit-image" src="' + esc(ex.imageUrl) + '" alt="">';
    html += '<p class="exhibit-body">' + esc(lang.body || '') + '</p>';
    html += '<div class="detail-qr-row"><span class="qr-chip" id="detail-qr"></span><span class="detail-qr-caption">이 QR은 이 전시품 안내로 바로 연결됩니다.</span></div>';
    html += '</div>';

    app.innerHTML = html;
    var qrEl = document.getElementById('detail-qr');
    if (qrEl) renderQrInto(qrEl, qrUrl(ex.id), 76);

    app.querySelectorAll('[data-lang]').forEach(function(b){
      b.addEventListener('click', function(){
        detailLangChoice[ex.id] = b.getAttribute('data-lang');
        renderDetail(ex.id);
      });
    });
  }

  function render(){ route(); }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
